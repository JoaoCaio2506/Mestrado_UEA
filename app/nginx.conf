server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  client_max_body_size 25m;

  # Same-origin proxy to the n8n webhook so the browser never makes a
  # cross-origin request — avoids touching n8n's CORS config entirely.
  location /webhook/ {
    proxy_pass https://n8n.srv1217617.hstgr.cloud/webhook/;
    proxy_set_header Host n8n.srv1217617.hstgr.cloud;
    proxy_ssl_server_name on;
  }

  location / {
    try_files $uri /index.html;
  }
}
