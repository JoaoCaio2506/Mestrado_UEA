server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  client_max_body_size 25m;

  # Same-origin proxy to the n8n webhook so the browser never makes a
  # cross-origin request — avoids touching n8n's CORS config entirely.
  location /webhook/ {
    proxy_pass https://n8n.srv1217617.hstgr.cloud/webhook/;
    proxy_set_header Host n8n.srv1217617.hstgr.cloud;
    proxy_ssl_server_name on;
  }

  # Same-origin proxy to the Grad-CAM API. It's plain HTTP on its own
  # port, so calling it directly from the (HTTPS) browser page would be
  # blocked as mixed content — this keeps the browser-facing call
  # same-origin/HTTPS and proxies server-side instead.
  #
  # Uses the bare IP, not the srv1217617.hstgr.cloud hostname — that
  # hostname is the VPS's own machine hostname, which resolves to
  # 127.0.1.1 (Debian/Ubuntu's self-hostname convention), and inside this
  # container's own network namespace that loopback address means the
  # container itself, not the host, so nothing is listening on it.
  location = /gradcam {
    proxy_pass http://72.60.149.39:8002/gradcam;
    proxy_read_timeout 120s;
  }

  location / {
    try_files $uri /index.html;
  }
}
